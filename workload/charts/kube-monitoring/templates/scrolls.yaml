# The scrolls application's namespace: its credentials and its workload.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scrolls-app-credentials
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: 9d4e1c7a3b6f4c20a85e
  S3_SECRET_KEY: f0a8c35e91d24b7ea6c3d58e2b17940c6e3a
---
apiVersion: v1
kind: Secret
metadata:
  name: scrolls-signing-key
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
type: Opaque
stringData:
  SIGNING_KEY: 7c1e5b9a2d804f63b1a97e0c4d58f2a61b3e90d7c5a4f8e2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scrolls-app
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# How much of the ledger scrolls-app keeps warm in memory, in megabytes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrolls-ledger
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
data:
  megabytes: "{{ .Values.scrolls.ledgerMegabytes }}"
---
# Placeholder for the scrolls application: it holds the credentials, keeps the
# ledger warm in memory and idles. The real application replaces it later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrolls-app
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/name: scrolls-app
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scrolls-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrolls-app
        app.kubernetes.io/part-of: scrolls
    spec:
      serviceAccountName: scrolls-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scrolls-app
          image: {{ .Values.scrolls.image.repository }}:{{ .Values.scrolls.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              mb=$(cat /ledger/megabytes)
              echo "[scrolls] warming ${mb} MB of the ledger"
              ledger=$(head -c "${mb}000000" /dev/zero | tr '\0' 'l')
              echo "[scrolls] ledger warm (${#ledger} bytes), serving"
              while true; do sleep 3600; done
          envFrom:
            - secretRef:
                name: scrolls-app-credentials
            - secretRef:
                name: scrolls-signing-key
          volumeMounts:
            - name: ledger
              mountPath: /ledger
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: ledger
          configMap:
            name: scrolls-ledger
